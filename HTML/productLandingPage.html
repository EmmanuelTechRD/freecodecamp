<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Building a Product Landing Page - freeCodeCamp CSS Course</title>

    <link rel="stylesheet" href="../CSS/productLandingPage.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img
          src="https://www.esportfolio.dev/assets/emmanuelSotoLogo-DvxE98a6.svg"
          alt="Logo"
          id="header-img"
        />
      </div>
      <nav id="nav-bar">
        <ul>
          <li>
            <a href="#about" class="nav-link">About Us</a>
          </li>
          <li>
            <a href="#learn" class="nav-link">Learn with Us</a>
          </li>
          <li>
            <a href="#donate" class="nav-link">Donate</a>
          </li>
        </ul>
      </nav>
    </header>
    <iframe
      id="video"
      width="560"
      height="315"
      src="https://www.youtube.com/embed/JgDNFQ2RaLQ?si=0BSwslN0yIdyyD0F"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <form action="https://www.freecodecamp.org/email-submit" id="form">
      <input type="email" name="email" id="email" placeholder="Enter your email here.">
      <input type="submit" value="Submit" id="submit">
    </form>
  </body>
</html>
